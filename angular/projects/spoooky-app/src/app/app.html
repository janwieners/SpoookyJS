<main class="layout">
  <header class="appbar">
    <h1>SpoookyJS — Tic Tac Toe</h1>
    <div class="controls">
      <app-evaluation-toggle />
      <button type="button" class="restart" (click)="restart()">Neues Spiel</button>
    </div>
  </header>

  @if (error()) {
    <p class="error" role="alert">{{ error() }}</p>
  }

  <div class="content">
    <section class="board-area"><app-board /></section>
    <aside class="side">
      <app-ai-config-panel />
      <app-decision-panel />
      <app-mcts-tree />
      <app-game-log />
    </aside>
  </div>
</main>
