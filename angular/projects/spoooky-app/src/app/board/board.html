<div class="board" [class.thinking]="aiThinking()">
  @for (cell of cells(); track $index) {
    <button class="cell" type="button" (click)="onCellClick($index)">
      @if (imageFor(cell); as src) {
        <img [src]="src" alt="" />
      }
    </button>
  }
  @if (aiThinking()) {
    <div class="overlay">Die KI denkt …</div>
  }
</div>
